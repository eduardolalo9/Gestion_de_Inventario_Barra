name: Firestore Rules Tests

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules tests
        run: npm test
