name: Respaldo semanal de Firestore

# ═══════════════════════════════════════════════════════════════════════════
#  POR QUÉ
#  Los respaldos de la app viven en el localStorage del teléfono, así que
#  desaparecen exactamente cuando más se necesitan (navegador limpiado,
#  teléfono perdido). Y Firestore en plan Spark no exporta solo: si algo
#  borra datos, no hay punto de restauración. Esto deja una copia semanal
#  fuera del teléfono y fuera de Firestore.
#
#  OJO — ESTE REPOSITORIO ES PÚBLICO. Los artefactos de Actions son
#  descargables por cualquiera que pueda ver el repo. Por eso el respaldo se
#  CIFRA con AES-256 antes de subirse: aunque alguien lo baje, sin la
#  contraseña no vale nada. NUNCA subir el JSON en claro.
#
#  SECRETOS QUE HAY QUE CREAR (Settings → Secrets and variables → Actions):
#    FIREBASE_SERVICE_ACCOUNT  → contenido completo del JSON de la cuenta de
#                                servicio (Consola Firebase → Configuración
#                                del proyecto → Cuentas de servicio →
#                                Generar nueva clave privada)
#    RESPALDO_PASSPHRASE       → una contraseña larga inventada por ti.
#                                GUÁRDALA EN TU GESTOR DE CONTRASEÑAS: sin
#                                ella el respaldo es irrecuperable.
#
#  COPIA FUERA DE GITHUB (v5.58) — opcional pero RECOMENDADA
#  Un artefacto de Actions vive 90 días y solo en GitHub: si se pierde la cuenta o el repositorio, se pierde con él. Con el secreto
#    RCLONE_CONF   → el contenido de tu rclone.conf con un destino llamado «respaldo» (tu Google Drive)
#  cada respaldo cifrado se copia TAMBIÉN a la carpeta «BarInventory-respaldos» de tu Drive y se VERIFICA (mismo tamaño). Sin el secreto, el
#  paso avisa en el resumen del trabajo y todo lo demás sigue igual. Pasos para crearlo: herramientas/respaldo-externo.md
#
#  PARA RESTAURAR:
#    gpg --batch --yes --passphrase "TU_PASSPHRASE" \
#        --decrypt respaldo-AAAA-MM-DD.json.gpg > respaldo.json
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '17 9 * * 1'      # lunes 09:17 UTC (~03:17 hora de Monterrey)
  workflow_dispatch:           # y a mano cuando quieras, desde la pestaña Actions

concurrency:
  group: respaldo
  cancel-in-progress: false    # un respaldo a medias no se cancela

jobs:
  respaldo:
    name: Copiar Firestore y cifrar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # firebase-admin 14 exige Node >= 22

      - name: Instalar firebase-admin
        run: npm install --no-save firebase-admin@14.5.1

      - name: Escribir la credencial en un archivo temporal
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CUENTA" ]; then
            echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 1
          fi
          printf '%s' "$CUENTA" > "$RUNNER_TEMP/cuenta.json"

      - name: Generar el respaldo
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cuenta.json
          GOOGLE_CLOUD_PROJECT: gestor-de-inventarios-76c19
        run: node herramientas/respaldo-firestore.js --salida respaldos

      - name: Verificar que el respaldo trae datos de verdad (antes de cifrar)
        run: |
          set -o pipefail          # si el verificador falla (respaldo vacío), el trabajo falla: no se cifra ni se guarda nada inútil
          for f in respaldos/*.json; do
            node herramientas/verificar-respaldo.js "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Cifrar (AES-256) y borrar el JSON en claro
        env:
          PASSPHRASE: ${{ secrets.RESPALDO_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "Falta el secreto RESPALDO_PASSPHRASE"; exit 1
          fi
          for f in respaldos/*.json; do
            gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase "$PASSPHRASE" "$f"
            rm -f "$f"          # el claro no sale nunca del runner
          done
          ls -la respaldos/

      - name: Guardar el respaldo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-firestore-${{ github.run_number }}
          path: respaldos/*.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Copiar el respaldo CIFRADO a Google Drive (fuera de GitHub) y verificarlo
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::warning::Copia fuera de GitHub NO configurada (falta el secreto RCLONE_CONF). El respaldo solo existe en GitHub 90 días."
            echo "### ⚠️ Copia fuera de GitHub NO configurada" >> "$GITHUB_STEP_SUMMARY"
            echo "Falta el secreto RCLONE_CONF. Pasos: herramientas/respaldo-externo.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo apt-get install -y rclone >/dev/null
          umask 077
          printf '%s' "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf"
          DESTINO="respaldo:BarInventory-respaldos"
          rclone --config "$RUNNER_TEMP/rclone.conf" copy respaldos/ "$DESTINO" --include '*.gpg'
          for f in respaldos/*.gpg; do
            n=$(basename "$f")
            local_size=$(stat -c %s "$f")
            remoto_size=$(rclone --config "$RUNNER_TEMP/rclone.conf" lsjson "$DESTINO" --files-only --include "$n" 2>/dev/null | tr -d ' \n' | sed -n 's/.*"Size":\([0-9]*\).*/\1/p')
            if [ -z "$remoto_size" ] || [ "$remoto_size" != "$local_size" ]; then
              echo "::error::La copia en Drive NO coincide ($n: local $local_size bytes, Drive ${remoto_size:-no existe})"; exit 1
            fi
            echo "✅ $n copiado a Drive y verificado ($local_size bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Borrar la credencial del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/cuenta.json" "$RUNNER_TEMP/rclone.conf"
