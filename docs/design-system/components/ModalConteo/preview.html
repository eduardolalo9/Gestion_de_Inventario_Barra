<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
#raiz{padding:16px;display:flex;flex-direction:column;gap:12px;font-family:var(--font-sans)}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style></head>
<body><div id="raiz"><div class="inv-modal" style="border-radius:16px;max-width:420px">
  <div class="inv-modal__grabber"></div>
  <div class="inv-modal__titulo">Don Julio 70 · 700 ml</div>
  <div class="inv-modal__sub">Barra principal · Tequila</div>
  <div class="inv-modal__campo">
    <div class="inv-modal__etq"><i class="fa-solid fa-boxes-stacked"></i>Botellas cerradas</div>
    <input class="inv-modal__num" inputmode="decimal" value="4">
  </div>
  <div class="inv-modal__campo">
    <div class="inv-modal__etq"><i class="fa-solid fa-bottle"></i>Abiertas <span class="inv-modal__pista">ingresa el peso en oz</span></div>
    <div class="inv-abierta"><span class="inv-abierta__etq">Abierta 1</span><input class="inv-modal__num inv-abierta__num" value="18.40"><button class="inv-abierta__quitar" aria-label="Quitar"><i class="fa-solid fa-xmark"></i></button></div>
    <button class="inv-modal__agregar"><i class="fa-solid fa-plus"></i>Agregar otra abierta</button>
  </div>
  <div class="inv-modal__acciones"><button class="inv-modal__btn inv-modal__btn--fantasma">Cancelar</button><button class="inv-modal__btn inv-modal__btn--primario">Guardar</button></div>
</div></div>

</body></html>
