    <!-- FOUC prevention: aplicar tema ANTES de cualquier render -->
    <script>
        // Evitar FOUC (Flash Of Unstyled Content): aplicar tema antes de renderizar
        (function() {
            try {
                var t = localStorage.getItem('inventarioApp_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch(_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- FIX ICONS: Generar íconos PWA dinámicamente via Canvas (evita 404 del manifest) -->
    <script>
    (function generatePWAIcons() {
        function makeIcon(size) {
            var c = document.createElement('canvas');
            c.width = c.height = size;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#0A84FF';
            try { ctx.roundRect(0, 0, size, size, size * 0.22); }
            catch(_) { ctx.rect(0, 0, size, size); } // fallback: sin roundRect
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold ' + Math.round(size * 0.52) + 'px system-ui,sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('B', size / 2, size / 2 + size * 0.03);
            return c.toDataURL('image/png');
        }
        try {
            var link192 = document.createElement('link');
            link192.rel = 'icon'; link192.type = 'image/png';
            link192.href = makeIcon(192);
            document.head.appendChild(link192);
            var appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.href = makeIcon(180);
            document.head.appendChild(appleLink);
        } catch(e) { /* canvas no disponible */ }
    })();
    </script>

    <!-- ══════════════════════════════════════════════════════════
         FIX 4 — RESILIENCIA OFFLINE: Registro del Service Worker
         ══════════════════════════════════════════════════════════ -->
    <script>
        (function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                console.info('[SW] Service Workers no soportados en este navegador.');
                return;
            }
            // Esperar a que la página esté completamente cargada para no
            // competir con los recursos críticos de primer render.
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.info('[SW] Registrado con scope:', registration.scope);

                        // FIX-ICONS: Los iconos del manifest (icons/icon-192.png y icon-512.png)
                        // no existen como archivos físicos. Los generamos aquí via Canvas y los
                        // enviamos al SW para que los cachée y los sirva cuando el navegador los
                        // solicite al validar la instalabilidad de la PWA.
                        navigator.serviceWorker.ready.then(function(reg) {
                            if (!reg.active) return;
                            try {
                                function _makeIconPng(size) {
                                    var c = document.createElement('canvas');
                                    c.width = c.height = size;
                                    var ctx = c.getContext('2d');
                                    ctx.fillStyle = '#0A84FF';
                                    try { ctx.roundRect(0, 0, size, size, size * 0.22); }
                                    catch(_) { ctx.rect(0, 0, size, size); }
                                    ctx.fill();
                                    ctx.fillStyle = '#FFFFFF';
                                    ctx.font = 'bold ' + Math.round(size * 0.52) + 'px system-ui,sans-serif';
                                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                    ctx.fillText('B', size / 2, size / 2 + size * 0.03);
                                    return c.toDataURL('image/png');
                                }
                                reg.active.postMessage({
                                    type:    'CACHE_ICONS',
                                    icon192: _makeIconPng(192),
                                    icon512: _makeIconPng(512)
                                });
                            } catch(e) { console.warn('[SW] No se pudieron cachear íconos PWA:', e); }
                        });

                        // Detectar actualizaciones del SW (nueva versión deployada)
                        registration.addEventListener('updatefound', function() {
                            var newWorker = registration.installing;
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Nueva versión disponible — notificar al usuario
                                    console.info('[SW] Nueva versión disponible. Recarga para actualizar.');
                                    if (typeof showNotification === "function") {
                                        showNotification('🔄 Nueva versión disponible — recarga la página');
                                    }
                                }
                            });
                        });
                    })
                    .catch(function(err) {
                        // El SW es una mejora progresiva; su fallo no bloquea la app.
                        console.warn('[SW] Error al registrar Service Worker:', err);
                    });

                // Escuchar mensajes del SW (ej. "SYNC_PENDING")
                navigator.serviceWorker.addEventListener('message', function(event) {
                    if (!event.data) return;
                    if (event.data.type === 'SYNC_PENDING') {
                        var _sync = window.syncToCloud;
                        if (window._db && navigator.onLine && typeof _sync === 'function') {
                            _sync();
                        }
                    }
                });
            });
        })();
    </script>

    <script>
        // ⚠️ ADVERTENCIA DE SEGURIDAD: Esta clave es visible para cualquier
        // usuario que abra el código fuente. Asegúrate de restringir la API Key
        // en https://console.cloud.google.com → Credenciales → Restricciones de clave.
        const firebaseConfig = {
              apiKey: "AIzaSyDaMcyv_o0YYv9XRDG1A-V3IrboLFK53-o",
  authDomain: "gestor-de-inventarios-76c19.firebaseapp.com",
  projectId: "gestor-de-inventarios-76c19",
  storageBucket: "gestor-de-inventarios-76c19.firebasestorage.app",
  messagingSenderId: "520575498448",
  appId: "1:520575498448:web:3a83c2e4fcaedfc9d386d5"
};

        // ID del documento Firestore que almacena el estado de ESTA instalación.
        const FIRESTORE_DOC_ID = "barra-principal";

        // PHASE 2: Tu Site Key de reCAPTCHA Enterprise (de Google Cloud Console)
        const RECAPTCHA_SITE_KEY = "6LebJ54tAAAAAOaz0aBde1R3SFpMtdyRPaCDbuRh";

        // ─── Inicializar Firebase + App Check ───
        let _db   = null;
        let _auth = null;
        
        (function initFirebase() {
            const configured = Object.values(firebaseConfig).every(v => 
                typeof v === "string" && v.length > 0 && !v.includes("REEMPLAZA")
            );
            if (!configured) {
                console.warn("[Firebase] Config incompleta — solo se usará localStorage.");
                return;
            }
            try {
                firebase.initializeApp(firebaseConfig);
                _db   = firebase.firestore();
                _auth = firebase.auth();

                try {
                    _db.settings({
                        cacheSizeBytes:               firebase.firestore.CACHE_SIZE_UNLIMITED,
                        experimentalForceLongPolling: true,
                        ignoreUndefinedProperties:    true
                    });
                } catch (_) {}
                
                _db.enablePersistence({ synchronizeTabs: true }).catch(err => {
                    if (err.code === 'failed-precondition') {
                        console.warn("[Firebase] Persistencia offline no disponible (múltiples pestañas).");
                    } else if (err.code === 'unimplemented') {
                        console.warn("[Firebase] Persistencia offline no soportada en este navegador.");
                    } else {
                        console.warn("Persistencia falló:", err);
                    }
                });
                
                console.info("[Firebase] Inicializado correctamente ✓");
                window._db   = _db;
                window._auth = _auth;

                // ═══════════════════════════════════════════════════════════════
                // PHASE 2: INICIALIZAR APP CHECK con reCAPTCHA Enterprise
                // ═══════════════════════════════════════════════════════════════
                initAppCheck();

            } catch (e) {
                console.error("[Firebase] Error al inicializar:", e);
                _db = null;
            }
        })();

        /**
         * PHASE 2: Inicializa Firebase App Check
         * 
         * Comportamiento:
         * - Desarrollo (localhost): Usa DEBUG_TOKEN
         * - Producción (GitHub Pages, dominio real): Usa reCAPTCHA Enterprise
         */
        function initAppCheck() {
            const isLocalhost = 
                window.location.hostname === 'localhost' || 
                window.location.hostname === '127.0.0.1';

            if (isLocalhost) {
                // ─ MODO DESARROLLO/EMULATOR ─
                // DEBUG_TOKEN permite pruebas sin reCAPTCHA
                console.info("[AppCheck] 🔧 Modo DESARROLLO detectado");
                console.info("[AppCheck] Para usar en localhost, debes habilitar DEBUG_TOKEN:");
                console.info("[AppCheck]   self.FIREBASE_APPCHECK_DEBUG_TOKEN = true; (en Dev Tools)");
                
                // Alternativamente, puedes forzarlo aquí (solo para desarrollo):
                // Descomenta la línea siguiente SI SOLO usas localhost
                // self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;

                try {
                    firebase.appCheck().initializeAppCheck({
                        provider: new firebase.appCheck.ReCaptchaEnterpriseProvider(
                            RECAPTCHA_SITE_KEY
                        ),
                        isTokenAutoRefreshEnabled: true
                    });
                    console.info("[AppCheck] ✓ Inicializado en modo DESARROLLO (reCAPTCHA Enterprise standby)");
                } catch (e) {
                    console.warn("[AppCheck] Error inicializando (es normal si ya está inicializado):", e.message);
                }
            } else {
                // ─ MODO PRODUCCIÓN ─
                // Usa reCAPTCHA Enterprise en GitHub Pages, dominio real, etc.
                console.info("[AppCheck] 🚀 Modo PRODUCCIÓN detectado");
                try {
                    firebase.appCheck().initializeAppCheck({
                        provider: new firebase.appCheck.ReCaptchaEnterpriseProvider(
                            RECAPTCHA_SITE_KEY
                        ),
                        isTokenAutoRefreshEnabled: true
                    });
                    console.info("[AppCheck] ✓ Inicializado con reCAPTCHA Enterprise");
                } catch (e) {
                    console.error("[AppCheck] Error inicializando App Check:", e);
                }
            }
        }

        // Opcional: Exponer función para debugging en consola
        window._appCheckStatus = function() {
            const appCheck = firebase.appCheck();
            console.log("[AppCheck Status]", {
                initialized: appCheck ? "yes" : "no",
                provider: "reCAPTCHA Enterprise",
                siteKey: RECAPTCHA_SITE_KEY.substring(0, 10) + "..."
            });
        };

    </script>
